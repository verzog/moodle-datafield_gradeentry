name: Release zip

# Build the installable plugin zip (top folder gradeentry/, the subplugin directory under mod/data/field) and
# attach it to a GitHub release when the release is published. It can also be run by hand against an existing
# release to rebuild and re-attach the zip; never attach release zips by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to package (e.g. v1.0.0-beta.4)'
        required: true

permissions:
  contents: write

jobs:
  release:
    uses: verzog/moodle-ci-workflows/.github/workflows/release-zip.yml@vdiddy/more-inputs
    with:
      tag: ${{ inputs.tag }}
